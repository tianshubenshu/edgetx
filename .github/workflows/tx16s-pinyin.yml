name: TX16S MkII custom firmware

on:
  push:
    branches: [tx16s-pinyin]
    paths:
      - 'radio/**'
      - 'cmake/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - '.github/workflows/tx16s-pinyin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tx16s-pinyin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.12
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned font converter
        run: npm install --prefix /tmp/edgetx-font-conv --ignore-scripts --no-audit --no-fund lv_font_conv@1.5.3
      - name: Append missing Chinese glyphs
        shell: bash
        run: |
          set -o pipefail
          python3 tools/extend-cn-fonts.py --font-converter /tmp/edgetx-font-conv/node_modules/.bin/lv_font_conv | tee font-extension.log
          tar -czf extended-cn-fonts.tar.gz radio/src/fonts/lvgl/std/lv_font_cn_*.c
      - name: Generate dictionary from available glyphs
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install --disable-pip-version-check pypinyin==0.53.0
          python3 tools/generate-pinyin-dictionary.py | tee dictionary-size.log
      - name: Build TX16S firmware
        env:
          FLAVOR: tx16s
          EXTRA_OPTIONS: -DTRANSLATIONS=CN
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          EDGETX_VERSION_SUFFIX: pinyin
        shell: bash
        run: |
          set -o pipefail
          ./tools/build-gh.sh 2>&1 | tee size-build.log
          stat -c '%n %s bytes' tx16s-*.bin
      - name: Check Flash headroom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('.').glob('tx16s-*.bin'))
          assert len(files) == 1, 'Expected exactly one TX16S firmware'
          size = files[0].stat().st_size
          free = 2 * 1024 * 1024 - size
          print(f'Firmware bytes: {size}; Flash headroom: {free} bytes ({free / 1024:.2f} KiB)')
          assert free >= 24 * 1024, 'Flash headroom below the 24 KiB development reserve'
          PY
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tx16s-pinyin-${{ github.sha }}
          path: |
            tx16s-*.bin
            tx16s-*.uf2
            LICENSE
            font-extension.log
            size-build.log
            extended-cn-fonts.tar.gz
            dictionary-size.log
            radio/src/gui/colorlcd/libui/pinyin_dictionary.h
          if-no-files-found: error
          retention-days: 15
